<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LLM Conversation Memory</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="chat-container">

    <div class="header">

        <h1>LLM Conversation</h1>

        <form
            action="/clear"
            method="POST"
        >

            <button
                class="clear-button"
                type="submit"
            >
                Clear
            </button>

        </form>

    </div>


    <!-- SCROLLABLE CONVERSATION -->

    <div
        class="conversation"
        id="conversation"
    >

        {% for message in messages %}


            {% if message.role == "assistant" %}

                <div class="message assistant-message">

                    {{ message.content | safe }}

                </div>


            {% else %}

                <div class="message user-message">

                    {{ message.content }}

                </div>

            {% endif %}


        {% endfor %}

    </div>


    <!-- INPUT STAYS AT BOTTOM -->

    <form
        class="input-area"
        method="POST"
    >

        <input
            type="text"
            name="user_prompt"
            placeholder="Type a message..."
            autocomplete="off"
            required
            autofocus
        >

        <button type="submit">
            Send
        </button>

    </form>

</div>


<script>

    // Automatically scroll to newest message

    const conversation =
        document.getElementById("conversation");

    conversation.scrollTop =
        conversation.scrollHeight;

</script>


</body>

</html>
